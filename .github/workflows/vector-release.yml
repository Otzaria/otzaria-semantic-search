# Produce the semantic vectors for a library release, reusing every vector whose text
# did not change.
#
# The reuse key is `embedding_text_sha256`, not a line id. A vector is a function of the
# text that was embedded and nothing else, so a digest present in the previous release's
# ledger names a vector that is already correct — whatever id it now carries, and whether
# or not the library's own identifiers moved underneath it. See docs/VECTOR_CI_PLAN_HE.md.
#
# The shape below is the one the v1 baseline actually ran by hand, with the same commands
# and the same order. Two things it needs that this repository cannot create, and which
# must exist before a run succeeds:
#
#   1. **`[self-hosted, kaggle, gpu]` runners.** A Kaggle session registers itself as a
#      one-job JIT runner and picks up the `embed` job — the pattern LinkerToOtzaria runs
#      in production (`scripts/dispatch_kaggle_relink.sh`). Until that provisioner is
#      ported here, `embed` has nowhere to run. The baseline instead pushed 48 kernels
#      directly, which works but keeps the logs and the retries inside Kaggle.
#   2. **A `[self-hosted, linux, large-disk]` runner.** 5.7M x 1024 f32 is 23.5 GB of
#      vectors and a 26 GB artifact; a hosted runner has about 14 GB free.
#
# `index_url` is an input rather than something fetched by name: the canonical index is
# produced by `otzaria build-release-index` and shipped inside the application's indexed
# library package, and this workflow must consume *that* index — `corpus_id` covers the
# whole index, so an artifact built from any other one is rejected at install.
name: vector-release

on:
  repository_dispatch:
    # Sent by SeforimLibrary once a release is published, with a PAT.
    types: [library-released]
  workflow_dispatch:
    inputs:
      library_tag:
        description: SeforimLibrary release tag to build vectors for
        required: true
      index_url:
        description: URL of the release Tantivy index archive for that library version
        required: true
      base_artifact:
        description: >-
          Tag of the vector release to reuse from. Empty resolves to the newest, and no
          previous release at all means a full baseline — every line goes to the GPU.
        required: false
        default: ''

concurrency:
  # One vector build at a time. Not shared with the linker's `linker-relink` group: this
  # runs after the library build has finished and on separate Kaggle accounts, so the two
  # cannot want the same GPU. The preflight step checks that rather than trusting it.
  group: vector-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  LIBRARY_REPO: Otzaria/SeforimLibrary
  LINKER_REPO: Otzaria/LinkerToOtzaria
  ENGINE_REPO: Otzaria/otzaria_search_engine
  # A shard boundary must land on a multiple of the batch size: llama.cpp's output depends
  # on batch composition, so a boundary that splits a batch does not reproduce. The
  # baseline used 119_424 = 3_732 x 32, which is ~1.1 h per GPU.
  SHARD_RECORDS: 119424
  EMBED_BATCH: 32
  EMBEDDING_DIM: 1024
  # GitHub refuses a release asset over 2 GB.
  ASSET_SPLIT_BYTES: 1900m

jobs:
  # ---------------------------------------------------------------------------------
  plan:
    runs-on: [self-hosted, linux, large-disk]
    timeout-minutes: 240
    outputs:
      library_tag: ${{ steps.resolve.outputs.library_tag }}
      base_artifact: ${{ steps.resolve.outputs.base_artifact }}
      total_records: ${{ steps.split.outputs.total_records }}
      embed_records: ${{ steps.split.outputs.embed_records }}
      shards: ${{ steps.split.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with: { path: semantic }

      - name: Refuse to start while the linker holds a GPU
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          # One API call, and it turns a possible collision into an immediate failure.
          active=$(gh run list -R "$LINKER_REPO" --workflow relink.yml \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" != "0" ]; then
            echo "::error::$active relink run(s) still active in $LINKER_REPO"
            exit 1
          fi

      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ inputs.library_tag || github.event.client_payload.library_tag }}'
          [ -n "$tag" ] || { echo "::error::no library tag"; exit 1; }
          echo "library_tag=$tag" >> "$GITHUB_OUTPUT"

          base='${{ inputs.base_artifact }}'
          if [ -z "$base" ]; then
            # Resolved rather than assumed, so a full baseline is a state and not a failure.
            base=$(gh release list -R "$GITHUB_REPOSITORY" --limit 30 --json tagName \
              --jq '[.[] | select(.tagName | startswith("vectors-"))][0].tagName // ""')
          fi
          echo "base_artifact=$base" >> "$GITHUB_OUTPUT"
          echo "library=$tag base=${base:-<none, full baseline>}"

      - name: Pin the library release
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download '${{ steps.resolve.outputs.library_tag }}' \
            -R "$LIBRARY_REPO" -p 'build_provenance.json' -D provenance
          jq -r '.correlation_id // empty, .source_commit // empty' provenance/build_provenance.json

      - name: Fetch the release index
        run: |
          set -euo pipefail
          # The index the application ships, never one built here: `corpus_id` is derived
          # from its whole content, and an artifact whose corpus_id no device reproduces
          # is refused at install rather than merely wrong.
          curl -fsSL '${{ inputs.index_url || github.event.client_payload.index_url }}' -o index.tar.zst
          mkdir -p index && tar --use-compress-program=unzstd -xf index.tar.zst -C index --strip-components=1
          test -f index/meta.json || { echo "::error::no Tantivy meta.json in the archive"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Export the plan
        run: |
          set -euo pipefail
          # `export_semantic_plan` lives in the engine repo because reading the corpus
          # means reading Tantivy, which this crate deliberately does not depend on. It
          # links no inference backend: applying the recipe is arithmetic on strings.
          git clone --depth 1 "https://github.com/$ENGINE_REPO" engine
          cd engine/rust
          cargo build --release --locked --features semantic-integration \
            --bin export_semantic_plan --bin pack_semantic_artifact
          ./target/release/export_semantic_plan \
            --index "$GITHUB_WORKSPACE/index" \
            --library-version '${{ steps.resolve.outputs.library_tag }}' \
            --model "$GITHUB_WORKSPACE/semantic/config/model.json" \
            --chunking "$GITHUB_WORKSPACE/semantic/config/chunking.json" \
            --out "$GITHUB_WORKSPACE/plan"

      - id: split
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          cd semantic
          cargo build --release --locked --bin otzaria-semantic-search
          mkdir -p ../base
          base='${{ steps.resolve.outputs.base_artifact }}'
          ledger=()
          if [ -n "$base" ]; then
            gh release download "$base" -R "$GITHUB_REPOSITORY" -p 'ledger.jsonl.zst' -D ../base
            unzstd ../base/ledger.jsonl.zst -o ../base/ledger.jsonl
            ledger=(--ledger ../base/ledger.jsonl)
          fi
          ./target/release/otzaria-semantic-search plan-split \
            --plan ../plan/plan.jsonl "${ledger[@]}" --out ../split

          total=$(jq -r '.records' ../plan/export-manifest.json)
          embed=$(wc -l < ../split/embed.jsonl | tr -d ' ')
          echo "total_records=$total" >> "$GITHUB_OUTPUT"
          echo "embed_records=$embed" >> "$GITHUB_OUTPUT"
          # One shard per window, as a JSON list of skip offsets. A release that changed
          # a thousand lines produces one shard, not forty-eight.
          jq -nc --argjson n "$embed" --argjson s "${SHARD_RECORDS}" '[range(0; $n; $s)]' \
            > shards.json
          echo "shards=$(cat shards.json)" >> "$GITHUB_OUTPUT"
          echo "reuse $((total - embed)) of $total; $embed go to the GPU"

      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            plan/
            split/
          retention-days: 7

  # ---------------------------------------------------------------------------------
  embed:
    needs: plan
    if: needs.plan.outputs.embed_records != '0'
    runs-on: [self-hosted, kaggle, gpu]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Each shard is independent, and a failed one is re-run alone: the merge compares
      # the ids it was handed against the recipe's expected set, so a lost shard is a
      # refusal rather than a smaller artifact.
      matrix:
        skip: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: plan }

      - name: Embed this window on both cards
        env:
          # Measured on T4 and P100 alike: n_ctx 512 with batch 32 is the fastest, and a
          # larger context is monotonically worse — llama.cpp sizes the compute buffer
          # from n_ctx and reserves a logits tensor this backend never reads.
          OTZARIA_LLAMA_GPU_LAYERS: '99'
          OTZARIA_LLAMA_CONTEXTS: '1'
          OTZARIA_LLAMA_N_CTX: '512'
          OTZARIA_LLAMA_MAX_SEQUENCES: '32'
        run: |
          set -euo pipefail
          skip='${{ matrix.skip }}'
          take="$SHARD_RECORDS"
          # One process per card. Splitting a 0.6B model across two by layer spends more
          # on the interconnect than it saves. The halves are cut on a multiple of the
          # batch size, for the same reason the shards themselves are.
          half=$(( (take / 2 / EMBED_BATCH) * EMBED_BATCH ))
          for card in 0 1; do
            [ "$card" = 0 ] && s=$skip t=$half || s=$((skip + half)) t=$((take - half))
            [ "$t" -gt 0 ] || continue
            CUDA_VISIBLE_DEVICES=$card "$OTZARIA_BINARY" embed-shard \
              --plan split/embed.jsonl \
              --model config/model.json --model-file "$OTZARIA_MODEL_FILE" \
              --skip "$s" --take "$t" --batch "$EMBED_BATCH" \
              --out "shard-${skip}-gpu${card}" &
          done
          wait

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.skip }}
          path: shard-${{ matrix.skip }}-gpu*/
          retention-days: 7

  # ---------------------------------------------------------------------------------
  assemble:
    needs: [plan, embed]
    if: always() && needs.plan.result == 'success' && (needs.embed.result == 'success' || needs.plan.outputs.embed_records == '0')
    runs-on: [self-hosted, linux, large-disk]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with: { path: semantic }
      - uses: actions/download-artifact@v4
        with: { pattern: 'shard-*', path: shards }
      - uses: actions/download-artifact@v4
        with: { name: plan }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Gather reused and new vectors
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          base='${{ needs.plan.outputs.base_artifact }}'
          reuse=() ; from=()
          if [ -n "$base" ] && [ -s split/reuse.jsonl ]; then
            gh release download "$base" -R "$GITHUB_REPOSITORY" -p 'vectors.bin.part*' -D base
            cat base/vectors.bin.part* > base/vectors.f32
            reuse=(--reuse split/reuse.jsonl)
            from=(--base-vectors base/vectors.f32)
          fi
          cd semantic && cargo build --release --locked --bin otzaria-semantic-search && cd ..
          semantic/target/release/otzaria-semantic-search assemble \
            --shards shards --dim "$EMBEDDING_DIM" \
            "${reuse[@]}" "${from[@]}" --out merged

      - name: Pack and verify against the index
        run: |
          set -euo pipefail
          # Every check happens here and only here: each record's source digest against
          # the line the index holds — which is what catches a vector file that drifted
          # out of step with its id list — and the whole id set against the recipe's.
          # `pack` ends by reopening the artifact and validating it through the same door
          # a device uses.
          engine/rust/target/release/pack_semantic_artifact \
            --index index --library-version '${{ needs.plan.outputs.library_tag }}' \
            --vectors merged/vectors.f32 --records merged/records.jsonl \
            --model semantic/config/model.json --chunking semantic/config/chunking.json \
            --out artifact | tee artifact-report.txt

      - name: Cut the payload into assets GitHub accepts
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifact/manifest.json artifact/payloads.json artifact/book_index.json release/
          split -b "$ASSET_SPLIT_BYTES" -a 2 -d artifact/vectors.bin  release/vectors.bin.part
          split -b "$ASSET_SPLIT_BYTES" -a 2 -d artifact/metadata.jsonl release/metadata.jsonl.part
          zstd -q -19 -T0 merged/ledger.jsonl -o release/ledger.jsonl.zst
          ( cd release && shasum -a 256 * > SHA256SUMS.parts )

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/
            artifact-report.txt
          retention-days: 7

  # ---------------------------------------------------------------------------------
  publish:
    needs: [plan, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release }

      - name: Publish, draft first and verified before it is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest=$(grep '^Digest:' artifact-report.txt | awk '{print $2}')
          tag="vectors-v1-lib-${{ needs.plan.outputs.library_tag }}"
          # The digest belongs outside the package: verified without it, an install
          # detects damage and the wrong artifact, but not one deliberately rebuilt to
          # match. It goes in the notes, which are not one of the assets.
          gh release create "$tag" --draft --title "וקטורים סמנטיים — ${{ needs.plan.outputs.library_tag }}" \
            --notes "artifact digest: \`$digest\`"$'\n\n'"$(cat artifact-report.txt)"

          # Retried per asset. A 2 GB PUT that times out is an ordinary event, and
          # restarting 26 GB because the fourteenth part hiccupped is not.
          for attempt in 1 2 3 4 5; do
            have=$(gh release view "$tag" --json assets \
              --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.size)"')
            missing=0
            for f in release/*; do
              name=$(basename "$f")
              grep -qxF "$name $(stat -c%s "$f")" <<<"$have" && continue
              missing=$((missing + 1))
              gh release upload "$tag" "$f" --clobber || true
            done
            [ "$missing" = 0 ] && break
            echo "attempt $attempt left $missing asset(s) to place"
          done

          # Only now. A release visible with fifteen of sixteen parts is worse than one
          # that never appeared: it is downloaded, joined, and fails verification with no
          # way to tell why.
          have=$(gh release view "$tag" --json assets \
            --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.size)"')
          for f in release/*; do
            grep -qxF "$(basename "$f") $(stat -c%s "$f")" <<<"$have" || {
              echo "::error::$(basename "$f") never landed whole"; exit 1; }
          done
          gh release edit "$tag" --draft=false --latest
          echo "published $tag with digest $digest"
