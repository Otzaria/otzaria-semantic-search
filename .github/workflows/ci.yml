name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Cheapest first: format check (no compilation)
      - name: Check Formatting
        run: cargo fmt --check

      # ── Default features = the shipping configuration ──
      # No embedding backend is compiled in, so this proves a release build
      # cannot fall back to the deterministic stand-in embedder.

      - name: Cargo Check (default features)
        run: cargo check --all-targets

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      # `--lib --tests`, never `--all-targets`: the latter explicitly selects the
      # bench target, and an explicit selection overrides its `test = false`, so
      # cargo would *run* the 200k x 1024 benchmark — unoptimized — as part of the
      # test suite. Compiling benches/ is the release step's job.
      #
      # Asserts the production gate itself: tests/production_backend_gate.rs
      # only compiles without `mock-embedding` and requires the engine to refuse
      # to embed anything.
      - name: Test (default features)
        run: cargo test --lib --tests

      # ── With the stand-in backend = the full behavioural suite ──
      # The end-to-end tests need *some* embedding backend. Until real GGUF
      # inference lands (roadmap P2) that is the mock, which is why the whole
      # suite has to run in both configurations rather than one.

      - name: Clippy (mock-embedding)
        run: cargo clippy --all-targets --features mock-embedding -- -D warnings

      - name: Test (mock-embedding)
        run: cargo test --lib --tests --features mock-embedding

      # Broken intra-doc links are the usual way documentation rots silently.
      - name: Check Documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # Release compilation of the artifact that actually ships. `--all-targets`
      # covers benches/, so the benchmark cannot rot unnoticed; it is compiled,
      # not run — CI runners are too noisy for the numbers to mean anything.
      - name: Build Release
        run: cargo build --release --all-targets
