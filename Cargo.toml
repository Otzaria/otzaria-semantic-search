[package]
name = "otzaria-semantic-search"
version = "0.1.0"
edition = "2021"
description = "Hybrid semantic search engine for Otzaria"
license-file = "LICENSE"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "otzaria-semantic-search"
path = "src/main.rs"

[features]
default = []

# Enables the deterministic hash-based stand-in embedding backend.
#
# It is NOT a semantic model — it exists only so the rest of the pipeline
# (chunking, storage, fusion, grouping) can be developed and tested before a
# real GGUF inference backend lands. It must never be enabled in a production
# build: without this feature `EmbeddingRuntime::load` fails with
# `EmbeddingError::BackendUnavailable`, so a release binary cannot silently
# serve fake vectors. In-crate `#[cfg(test)]` code enables it implicitly.
mock-embedding = []

# Plain program, not a Criterion harness: the point is a re-runnable measurement,
# and a mobile-bound crate should not carry a benchmarking dependency tree for it.
# Measures `VectorStore` directly, so it needs no embedding backend and runs in a
# default build: `cargo bench`.
[[bench]]
name = "vector_search"
harness = false
# Without this, `cargo test --all-targets` *runs* the benchmark: a `harness = false`
# target is just a binary, and cargo executes it as a test. That meant every test
# run silently performed the full 200k x 1024 workload in an unoptimized build.
test = false

[dependencies]
# Error handling
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"

# Hashing (semantic IDs, chunk hashes, model checksums)
sha2 = "0.10"
