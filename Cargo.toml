[package]
name = "otzaria-semantic-search"
version = "0.1.0"
edition = "2021"
description = "Hybrid semantic search engine for Otzaria"
license-file = "LICENSE"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"

# Async / sync primitives
tokio = { version = "1", default-features = false, features = ["sync"] }

# Hashing
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
