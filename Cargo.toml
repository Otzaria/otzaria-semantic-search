[package]
name = "otzaria-semantic-search"
version = "0.1.0"
edition = "2021"
description = "Hybrid semantic search engine for Otzaria"
license-file = "LICENSE"
publish = false

[lib]
# `rlib` only: `otzaria_search_engine` is what produces the native library
# (roadmap §5). This crate exports no `extern "C"` symbol.
crate-type = ["rlib"]

[[bin]]
name = "otzaria-semantic-search"
path = "src/main.rs"

[features]
default = []

# Deterministic hash-based stand-in. NOT a semantic model; non-default so a release
# build fails with `BackendUnavailable` instead of serving fake vectors.
mock-embedding = []

# Real GGUF inference. Non-default because it compiles llama.cpp and ggml through
# cmake in every downstream build.
#
# Its crates are declared under `cfg(not(target_arch = "arm"))`: a 0.6B model at
# Q4 is unusable on 32-bit ARM, and `llama-cpp-sys-2`'s build script panics there
# anyway — it `.expect()`s `CARGO_CFG_TARGET_FEATURE`, which cargo omits for
# `armv7-linux-androideabi` (zero target features). The feature can therefore be
# on with no backend behind it; `semantic::backend` gates on the same condition.
llama-backend = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]

# Real ONNX inference, through ONNX Runtime and the Hugging Face tokenizer. Non-default,
# like `llama-backend`: real inference is opt-in, and a default build must be unable to
# produce embeddings at all (`tests/production_backend_gate.rs`). Which backend serves a
# model is decided by the model file's format — `.onnx` is ONNX, every other path GGUF —
# not by which features are on; see `semantic::backend`.
#
# Nothing is linked: ONNX Runtime is a shared library loaded when the first ONNX model
# is (see the `ort` declaration below), so this feature adds no build-time download and
# no native code to the binary. Its crates are declared for desktop targets only; on
# every other target the feature is on with no backend behind it, as `llama-backend`
# is on 32-bit ARM.
onnx-backend = ["dep:ort", "dep:tokenizers", "dep:libloading"]

# CUDA offload, for the build machine that produces the library's vectors — never
# for the application, which ships no CUDA runtime.
#
# It does not change what the artifact declares: `LlamaCppBackend::ID` names the
# implementation and the wiring, deliberately not the ggml backend, exactly as
# `n_gpu_layers` on Metal does not change it today. What it does change is the
# arithmetic, at the same order as the CPU-vs-Metal divergence
# `docs/P2_REFERENCE_VECTORS.md` §5 already measures, so a build that uses it owes
# the same parity evidence against the goldens.
cuda = ["llama-backend", "llama-cpp-2/cuda"]

[[bench]]
name = "vector_search"
harness = false
# Without this, `cargo test --all-targets` runs the full 200k x 1024 workload
# unoptimized, because a `harness = false` target is just a binary.
test = false

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha2 = "0.10"

# Optional, behind `llama-backend`. See `src/semantic/llama_backend.rs` and
# `docs/P2_INFERENCE_SPIKE.md`.
#
# Pinned exactly, for three reasons — read them before bumping:
#
# 1. It vendors a specific llama.cpp commit, and the stored vectors depend on it
#    (agreement between two builds is cosine 0.9948, not 1.0). The manifest records
#    the backend as index identity, so the version cannot move implicitly.
# 2. `llama_backend::tokenizer` derives the model pointer from `LlamaModel`'s
#    `repr(transparent)` layout, which upstream documents nowhere and explicitly
#    disclaims for sibling types. The pin is what makes that cast sound; the
#    runtime cross-checks only detect a break after the fact. Read
#    `llama_backend::tokenizer::RawVocab` first.
# 3. `llama_backend::micro_batch_for` lowers `n_ubatch` below `n_ctx`, which is
#    legal only for a causal model — llama.cpp aborts otherwise. Its list of
#    non-causal architectures is correct for this commit only; re-check with
#    `grep -rn 'causal_attn = false' llama.cpp/src/models/`.
#
# `default-features = false` because upstream defaults to
# `["openmp", "android-shared-stdcxx", "common"]` and this crate builds on five
# toolchains through Cargokit:
#
# * `android-shared-stdcxx` kept — sets `ANDROID_STL=c++_shared`, inert elsewhere.
#   A process holding both a static and a shared libc++ crashes obscurely.
# * `openmp` omitted — ggml has its own thread pool, and Apple clang ships no
#   `libomp`.
# * `common` omitted — it only gates grammar samplers, `json_schema_to_grammar`,
#   speculative decoding and memory reporting. Re-check if a stage wants generation.
#
# No GPU feature is requested, but on Apple Silicon `llama-cpp-2` attaches
# `metal` to its sys crate unconditionally, and Metal is then compiled *and used*:
# a 270.61 MiB MTL0 compute buffer per context and `graph splits = 2`.
# `n_gpu_layers = 0` keeps the weights on the CPU, not the backend out of the graph.
# Consequence: CPU-versus-Metal agreement is cosine 0.99491, so this platform and a
# CPU-only Android build may not produce identical vectors.
#
# Vendored: upstream's own `llama-cpp-sys-2` declaration omits
# `default-features = false`, so sys's `default = ["common"]` came back on
# regardless of what is set here, and the unlinkable `cpp-httplib` dependency
# it drags in breaks the Apple app link. See vendor/llama-cpp-2/README-VENDORED.md.
[target.'cfg(not(target_arch = "arm"))'.dependencies.llama-cpp-2]
path = "vendor/llama-cpp-2"
version = "=0.1.153"
default-features = false
features = ["android-shared-stdcxx"]
optional = true

# Reached directly for the one call `llama-cpp-2` does not expose: `llama_tokenize`
# with `parse_special = false`. It hardcodes `true`, which promotes a literal
# `<|endoftext|>` inside a book to a control token (measured: 162 tokens -> 158).
#
# Version-locked to `llama-cpp-2` so cargo unifies both on one build of llama.cpp;
# a mismatch would compile ggml twice and hand the tokenizer a foreign vocabulary.
[target.'cfg(not(target_arch = "arm"))'.dependencies.llama-cpp-sys-2]
version = "=0.1.153"
default-features = false
optional = true

# Optional, behind `onnx-backend`. See `src/semantic/onnx_backend.rs` and
# `docs/ONNX_BACKEND.md`.
#
# Pinned exactly, for two reasons — read them before bumping:
#
# 1. The API is still moving between release candidates: rc.10 made `Session::run`
#    take `&mut self` (why the backend keeps a pool of sessions), rc.12 introduced the
#    `api-*` features and rc.13 gated execution providers at compile time. A
#    resolver-chosen rc.14 is a different API.
# 2. It is part of what produces the stored vectors — the session options it applies
#    and the ONNX Runtime API level it requests — and the manifest records the backend
#    as index identity, so the version cannot move implicitly.
#
# `default-features = false, features = ["std", "load-dynamic"]`: the runtime is a
# shared library loaded at run time — from `OTZARIA_ONNX_RUNTIME`, else the platform's
# file name beside the graph — and never linked. The default, `download-binaries`,
# links pyke's static builds, and each of those disqualifies itself:
#
# * Windows x64: compiled with `/arch:AVX2` into `search_engine.dll`, where AVX2 code
#   can run at DLL load, so a pre-Haswell CPU loses the whole application — lexical
#   search included — rather than semantic search alone;
# * Linux: they need glibc >= 2.38, newer than the CI container (bookworm, 2.36) and
#   than Ubuntu 22.04, Debian 12 and RHEL 9;
# * Apple: they raise the application's floor to macOS 13.4 / iOS 15.1 and link
#   CoreML into it;
# * the build: they are fetched from cdn.pyke.io while cargo runs, which this build
#   network cannot reach.
#
# Loaded instead, a missing or unusable runtime is `BackendUnavailable` for semantic
# search and nothing else. No `api-*` feature: the default API level, 17, is all the
# backend uses, so any runtime from ONNX Runtime 1.17 on loads; the reference is
# Microsoft's official 1.28.0 release, which dispatches CPU features at run time.
#
# Declared for desktop targets only — macOS, Linux (glibc) and Windows (MSVC), each on
# aarch64 and x86_64 — the platforms Microsoft publishes that runtime for. iOS and
# Android have no runtime to load in v1: an iOS app cannot load code it did not ship
# signed, and shipping a runtime on either is future work. Elsewhere the feature is on
# with no backend behind it and an ONNX model gets `BackendUnavailable`, as a GGUF
# model does on 32-bit ARM. `semantic/mod.rs`, `semantic::backend` and
# `tests/onnx_backend.rs` carry the same condition, and a test in the last holds all
# the spellings together.
[target.'cfg(any(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "windows", target_env = "msvc", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies.ort]
version = "=2.0.0-rc.13"
default-features = false
features = ["std", "load-dynamic"]
optional = true

# Pinned exactly for the reason `ort` is, with the tokenizer's own twist: token ids are
# the primary correctness gate — the goldens compare them exactly — and this crate is
# what turns `tokenizer.json` into them.
#
# `default-features = false` drops `onig` (C, built through `cc`), `esaxx_fast` (C++)
# and `progressbar`. Exactly one regex engine has to be enabled or the crate refuses to
# compile, hence `fancy-regex`, which is pure Rust. A BERT normalizer and pre-tokenizer
# use no regex at all, so for this model family the engine cannot change an id; the
# token-id parity checks against the Python reference are what would say otherwise.
# The same targets as `ort`, since nothing else uses it.
[target.'cfg(any(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "windows", target_env = "msvc", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies.tokenizers]
version = "=0.23.2"
default-features = false
features = ["fancy-regex"]
optional = true

# Reached directly for the one thing `ort` reads and does not expose: the runtime's
# version string (`OrtGetApiBase()->GetVersionString()`), which the load log names —
# `ort::info()` carries a commit id, not a version. Opened only after `ort` has loaded the
# same file, so it bumps a reference count and runs no initializer twice. Unpinned: it
# decides no vector, and a range lets cargo unify it with `ort`'s own.
[target.'cfg(any(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "windows", target_env = "msvc", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies.libloading]
version = "0.9"
optional = true
