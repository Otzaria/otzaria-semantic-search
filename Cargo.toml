[package]
name = "otzaria-semantic-search"
version = "0.1.0"
edition = "2021"
description = "Hybrid semantic search engine for Otzaria"
license-file = "LICENSE"
publish = false

[lib]
# `rlib` only: `otzaria_search_engine` is what produces the native library
# (roadmap §5). This crate exports no `extern "C"` symbol.
crate-type = ["rlib"]

[[bin]]
name = "otzaria-semantic-search"
path = "src/main.rs"

[features]
default = []

# Deterministic hash-based stand-in. NOT a semantic model; non-default so a release
# build fails with `BackendUnavailable` instead of serving fake vectors.
mock-embedding = []

# Real ONNX inference, through ONNX Runtime and the Hugging Face tokenizer — the only
# inference this crate has. Non-default: real inference is opt-in, and a default build
# must be unable to produce embeddings at all (`tests/production_backend_gate.rs`). A
# model is an ONNX graph, `*.onnx`; any other model path is refused as an invalid model
# before a backend is asked (`semantic::model_package::ensure_onnx_model_path`).
#
# Nothing is linked: ONNX Runtime is a shared library loaded when the first ONNX model
# is (see the `ort` declaration below), so this feature adds no build-time download and
# no native code to the binary. Its crates are declared for desktop targets only; on
# every other target the feature is on with no backend behind it.
onnx-backend = ["dep:ort", "dep:tokenizers", "dep:libloading"]

[[bench]]
name = "vector_search"
harness = false
# Without this, `cargo test --all-targets` runs the full 200k x 1024 workload
# unoptimized, because a `harness = false` target is just a binary.
test = false

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha2 = "0.10"

# The vector store (`semantic::oxv`): segments are mapped rather than read into the heap,
# and every 1 MiB block of one carries a CRC-32. Both crates are already in the
# application's dependency graph through tantivy, at these versions (memmap2 0.9.11,
# crc32fast 1.5.0 in otzaria_search_engine's lockfile), so they add no crate to it. The
# requirements stay ranges so cargo unifies them with tantivy's.
memmap2 = "0.9"
crc32fast = "1.5"

# Optional, behind `onnx-backend`. See `src/semantic/onnx_backend.rs` and
# `docs/ONNX_BACKEND.md`.
#
# Pinned exactly, for two reasons — read them before bumping:
#
# 1. The API is still moving between release candidates. rc.14 requires an owned
#    Environment for Session::builder; rc.15 repairs native ownership and undefined
#    behavior. Neither is a stable 2.x release. The tested pin must not move implicitly.
# 2. The session options and ONNX Runtime API level help define stored vectors. The
#    manifest records the backend's wiring contract (not the crate version) as index
#    identity, so upgrades must prove token/vector/ranking parity before keeping it.
#
# `default-features = false, features = ["std", "load-dynamic", "api-17"]`: the runtime is a
# shared library loaded at run time — from the path the application passes, else
# `OTZARIA_ONNX_RUNTIME`, else the platform's file name beside the graph — and never
# linked. The default, `download-binaries`, links pyke's static builds, and each of those
# disqualifies itself:
#
# * Windows x64: compiled with `/arch:AVX2` into `search_engine.dll`, where AVX2 code
#   can run at DLL load, so a pre-Haswell CPU loses the whole application — lexical
#   search included — rather than semantic search alone;
# * Linux: they need glibc >= 2.38, newer than the CI container (bookworm, 2.36) and
#   than Ubuntu 22.04, Debian 12 and RHEL 9;
# * Apple: they raise the application's floor to macOS 13.4 / iOS 15.1 and link
#   CoreML into it;
# * the build: they are fetched from cdn.pyke.io while cargo runs, which this build
#   network cannot reach.
#
# Loaded instead, a missing or unusable runtime is `OnnxRuntimeUnavailable` for semantic
# search and nothing else. Explicit `api-17` keeps the minimum C API at 17 rather than
# rc.15's default API 31. The runtime must be 1.17+ and provide that table; the reference
# remains Microsoft's official 1.28.0 release. No runtime, CPU feature, graph setting,
# tokenizer version or vector format is changed by this Rust binding upgrade.
# rc.15 raises the desktop ONNX build-time MSRV from 1.88 to 1.92; CI checks it
# separately. Do not impose that optional dependency floor on non-ONNX/mobile builds.
#
# Declared for desktop targets only — macOS, Linux (glibc) and Windows (MSVC), each on
# aarch64 and x86_64 — the platforms Microsoft publishes that runtime for. iOS and
# Android have no runtime to load in v1: an iOS app cannot load code it did not ship
# signed, and shipping a runtime on either is future work. Elsewhere the feature is on
# with no backend behind it and an ONNX model gets `BackendUnavailable`.
# `semantic/mod.rs`, `semantic::backend` and
# `tests/onnx_backend.rs` carry the same condition, and a test in the last holds all
# the spellings together.
[target.'cfg(any(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "windows", target_env = "msvc", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies.ort]
version = "=2.0.0-rc.15"
default-features = false
features = ["std", "load-dynamic", "api-17"]
optional = true

# Pinned exactly for the reason `ort` is, with the tokenizer's own twist: token ids are
# the primary correctness gate — the goldens compare them exactly — and this crate is
# what turns `tokenizer.json` into them.
#
# `default-features = false` drops `onig` (C, built through `cc`), `esaxx_fast` (C++)
# and `progressbar`. Exactly one regex engine has to be enabled or the crate refuses to
# compile, hence `fancy-regex`, which is pure Rust — and the engine is not idle: the
# production tokenizer's normalizer runs five regex `Replace` rules (niqqud and
# cantillation, bidi and zero-width controls, the two quote marks, dashes). They are
# plain character classes, which both engines read the same way, and measured so: 57,348
# inputs from the library, niqqud, cantillation and all, gave ids identical to the
# Python package (onig). Changing the engine means re-running that comparison; see
# `docs/ONNX_BACKEND.md`. The same targets as `ort`, since nothing else uses it.
[target.'cfg(any(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "windows", target_env = "msvc", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies.tokenizers]
version = "=0.23.2"
default-features = false
features = ["fancy-regex"]
optional = true

# Reached directly to open the runtime *before* `ort` caches it. rc.15 fixes rc.13's
# failed-loader retry bug, but still panics on a null API table. The backend checks the
# entry point, UTF-8 version and `GetApi(17)` before calling `ort::init_from` — which
# opens the same file again, bumping a reference count. This also reads the runtime
# version for the load log. The handle is kept for the life of the process. See
# `onnx_backend::ensure_runtime`. Unpinned: it decides no vector, and a range lets cargo
# unify it with `ort`'s own.
[target.'cfg(any(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "windows", target_env = "msvc", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies.libloading]
version = "0.9"
optional = true
